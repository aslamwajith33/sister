<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff758c" />
      <stop offset="50%" stop-color="#ff7eb3" />
      <stop offset="100%" stop-color="#fa709a" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#f43f5e" flood-opacity="0.3" />
    </filter>
  </defs>
  <!-- Rounded App Background -->
  <rect width="512" height="512" rx="128" fill="url(#pinkGrad)" filter="url(#shadow)" />
  <!-- Inner White Halo -->
  <circle cx="256" cy="256" r="180" fill="#ffffff" opacity="0.25" />
  <!-- Center Flower Emoji / Graphic -->
  <text x="256" y="325" font-size="210" text-anchor="middle" font-family="'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji', sans-serif">🌸</text>
</svg>
